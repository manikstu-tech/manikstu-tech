<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Farmer avatar">
  <circle cx="50" cy="50" r="50" fill="#EAF3E6"/>
  <!-- shoulders / saree -->
  <path d="M14 100c0-19 16-30 36-30s36 11 36 30z" fill="#3A7030"/>
  <!-- saree pallu drape -->
  <path d="M50 72c14 0 30 9 33 24h-9c-4-13-16-19-24-19z" fill="#E6B800"/>
  <!-- neck -->
  <rect x="44" y="60" width="12" height="14" rx="4" fill="#BE824A"/>
  <!-- hair behind -->
  <path d="M28 48c0-20 10-30 22-30s22 10 22 30c0 6-2 12-4 16 3-16-2-34-18-34S31 60 32 64c-2-4-4-10-4-16z" fill="#2A2018"/>
  <!-- head -->
  <ellipse cx="50" cy="46" rx="18.5" ry="21" fill="#D89E63"/>
  <!-- ears + earrings -->
  <circle cx="31.5" cy="47" r="3.3" fill="#D89E63"/>
  <circle cx="68.5" cy="47" r="3.3" fill="#D89E63"/>
  <circle cx="31.5" cy="52" r="2" fill="#E6B800"/>
  <circle cx="68.5" cy="52" r="2" fill="#E6B800"/>
  <!-- hair front (center part) -->
  <path d="M31 43c1-15 10-22 19-22s18 7 19 22c-3-9-7-12-7-12l-3 4-4-4-5 4-4-4-3 4s-6 3-9 12z" fill="#2A2018"/>
  <!-- bun -->
  <circle cx="50" cy="20" r="6" fill="#2A2018"/>
  <!-- bindi -->
  <circle cx="50" cy="40" r="1.8" fill="#C1121F"/>
  <!-- eyebrows -->
  <rect x="39" y="42.5" width="7.5" height="1.8" rx="1" fill="#2A2018"/>
  <rect x="53.5" y="42.5" width="7.5" height="1.8" rx="1" fill="#2A2018"/>
  <!-- eyes -->
  <circle cx="43" cy="47" r="2.1" fill="#2A2018"/>
  <circle cx="57" cy="47" r="2.1" fill="#2A2018"/>
  <!-- nose -->
  <path d="M50 49v5" stroke="#A96C3C" stroke-width="1.8" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M44 58c3 3 9 3 12 0" stroke="#8A4234" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
