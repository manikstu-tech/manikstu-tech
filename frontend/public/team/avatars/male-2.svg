<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Farmer avatar">
  <circle cx="50" cy="50" r="50" fill="#FBF1DD"/>
  <!-- shoulders / shirt -->
  <path d="M14 100c0-19 16-30 36-30s36 11 36 30z" fill="#C4952A"/>
  <path d="M50 70c-6 0-11 3-14 7l14 10 14-10c-3-4-8-7-14-7z" fill="#A97D1E"/>
  <!-- neck -->
  <rect x="44" y="60" width="12" height="14" rx="4" fill="#B97C46"/>
  <!-- head -->
  <ellipse cx="50" cy="46" rx="19" ry="21" fill="#D19B60"/>
  <!-- ears -->
  <circle cx="31" cy="47" r="3.5" fill="#D19B60"/>
  <circle cx="69" cy="47" r="3.5" fill="#D19B60"/>
  <!-- gamcha / head wrap -->
  <path d="M30 40c0-15 10-23 20-23s20 8 20 23c0-3-1-6-2-8-5 2-31 2-36 0-1 2-2 5-2 8z" fill="#2A2018"/>
  <path d="M28 34c4-11 40-11 44 0 2-9-8-19-22-19S26 25 28 34z" fill="#D8452F"/>
  <!-- eyebrows -->
  <rect x="39" y="42" width="8" height="2" rx="1" fill="#2A2018"/>
  <rect x="53" y="42" width="8" height="2" rx="1" fill="#2A2018"/>
  <!-- eyes -->
  <circle cx="43" cy="47" r="2.1" fill="#2A2018"/>
  <circle cx="57" cy="47" r="2.1" fill="#2A2018"/>
  <!-- nose -->
  <path d="M50 49v5" stroke="#9C6636" stroke-width="2" stroke-linecap="round"/>
  <!-- mustache -->
  <path d="M42 57c3 3 13 3 16 0" stroke="#2A2018" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <!-- smile -->
  <path d="M44 61c3 3 9 3 12 0" stroke="#7A4A28" stroke-width="1.8" fill="none" stroke-linecap="round"/>
</svg>
